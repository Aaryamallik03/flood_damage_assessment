# Central config for the flood damage assessment pipeline

project:
  name: flood-damage-assessment
  case_study_aoi: "Rasuwa-Nuwakot-Dhading, Nepal"
  case_study_event_date: "2026-08-26"

data:
  xbd_root: "data/raw/xbd"
  sentinel_root: "data/raw/sentinel"
  processed_root: "data/processed"
  train_val_split: 0.85

damage_classifier:
  backbone: "resnet50"
  num_classes: 4              # no-damage, minor, major, destroyed
  pretrained: true
  patch_size: 224              # must match inference/predict.py's _IMAGE_TRANSFORM (also 224) -
                                # standard ImageNet input size for resnet backbones. Do not
                                # share this value with flood_segmentation.patch_size below;
                                # they're unrelated models with unrelated resolution needs, and
                                # training at one size while predict.py hardcodes another would
                                # silently degrade accuracy without erroring (ResNet's adaptive
                                # pooling absorbs the size mismatch instead of raising).
  batch_size: 16
  epochs: 25
  learning_rate: 0.0001
  weight_decay: 0.00001
  checkpoint_dir: "checkpoints/damage_classifier"

flood_segmentation:
  architecture: "unet"
  encoder: "resnet34"
  in_channels: 2               # SAR VV + VH polarization bands
  num_classes: 1                # binary: flood / no-flood
  patch_size: 256               # independent of damage_classifier.patch_size above - keep it that way
  batch_size: 8
  epochs: 30
  learning_rate: 0.0001
  checkpoint_dir: "checkpoints/flood_segmentation"

inference:
  device: "cuda"                # will fall back to cpu automatically if unavailable
  damage_model_path: "backend/models_store/damage_classifier.pt"
  flood_model_path: "backend/models_store/flood_segmentation.pt"

backend:
  host: "0.0.0.0"
  port: 8000
